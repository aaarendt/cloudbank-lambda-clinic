<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@700;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Open Sans', sans-serif; background: #fff; padding: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.group { display: flex; flex-direction: column; gap: 8px; }
.glabel { font-size: 9px; color: #888; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 2px; }
button { font-family: 'Open Sans', sans-serif; cursor: pointer; border: none; border-radius: 2px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-size: 12px; padding: 10px 20px; transition: background 150ms ease; }
.btn-primary { background: #4b2e83; color: #fff; }
.btn-primary:hover { background: #32006e; }
.btn-gold { background: #ffc700; color: #32006e; }
.btn-gold:hover { background: #e6b300; }
.btn-outline { background: transparent; color: #4b2e83; border: 2px solid #4b2e83; }
.btn-outline:hover { background: rgba(75,46,131,0.06); }
.btn-ghost { background: transparent; color: #4b2e83; border: none; }
.btn-ghost:hover { text-decoration: underline; }
.btn-sm { padding: 7px 14px; font-size: 11px; }
.btn-lg { padding: 14px 28px; font-size: 14px; }
.btn-disabled { background: #b3b3b3; color: #fff; cursor: not-allowed; }
/* dark bg */
.dark-group { background: #4b2e83; padding: 14px; border-radius: 3px; }
.btn-dark-outline { background: transparent; color: #fff; border: 2px solid #fff; }
.btn-dark-gold { background: #ffc700; color: #32006e; }
</style>
</head>
<body>
  <div class="group">
    <div class="glabel">Primary</div>
    <button class="btn-primary btn-lg">Get Started</button>
    <button class="btn-primary">Learn More</button>
    <button class="btn-primary btn-sm">Apply Now</button>
  </div>
  <div class="group">
    <div class="glabel">Gold CTA</div>
    <button class="btn-gold btn-lg">Explore Programs</button>
    <button class="btn-gold">Visit Campus</button>
    <button class="btn-gold btn-sm">Give Now</button>
  </div>
  <div class="group">
    <div class="glabel">Outline / Ghost</div>
    <button class="btn-outline">Outline Button</button>
    <button class="btn-ghost">Ghost / Text →</button>
    <button class="btn-disabled" disabled>Disabled</button>
  </div>
  <div class="group">
    <div class="glabel">On Dark</div>
    <div class="dark-group">
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button class="btn-dark-gold">Explore Now</button>
        <button class="btn-dark-outline">Learn More</button>
      </div>
    </div>
  </div>
</body>
</html>
