<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Open Sans', sans-serif; background: #fff; padding: 16px 20px; }
.grid { display: grid; grid-template-columns: 80px 1fr; gap: 10px 16px; align-items: center; }
.label { font-size: 10px; color: #888; font-family: monospace; }
.bar-wrap { display: flex; align-items: center; gap: 8px; }
.bar { height: 14px; background: #4b2e83; border-radius: 2px; }
.val { font-size: 10px; color: #4d4d4d; }
.divider { grid-column: 1/-1; border-bottom: 1px solid #f0f0f0; margin: 4px 0; }
</style>
</head>
<body>
<div class="grid">
  <div class="label">space-1 / 4px</div><div class="bar-wrap"><div class="bar" style="width:4px;"></div><div class="val">4px</div></div>
  <div class="label">space-2 / 8px</div><div class="bar-wrap"><div class="bar" style="width:8px;"></div><div class="val">8px</div></div>
  <div class="label">space-3 / 12px</div><div class="bar-wrap"><div class="bar" style="width:12px;"></div><div class="val">12px</div></div>
  <div class="label">space-4 / 16px</div><div class="bar-wrap"><div class="bar" style="width:16px;"></div><div class="val">16px</div></div>
  <div class="label">space-6 / 24px</div><div class="bar-wrap"><div class="bar" style="width:24px;"></div><div class="val">24px</div></div>
  <div class="label">space-8 / 32px</div><div class="bar-wrap"><div class="bar" style="width:32px;"></div><div class="val">32px</div></div>
  <div class="label">space-12 / 48px</div><div class="bar-wrap"><div class="bar" style="width:48px;"></div><div class="val">48px</div></div>
  <div class="label">space-16 / 64px</div><div class="bar-wrap"><div class="bar" style="width:64px;"></div><div class="val">64px</div></div>
  <div class="label">space-20 / 80px</div><div class="bar-wrap"><div class="bar" style="width:80px;"></div><div class="val">80px</div></div>
</div>
</body>
</html>
