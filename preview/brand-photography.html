<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Open Sans', sans-serif; background: #1a1a1a; padding: 0; overflow: hidden; }
.photo { width: 700px; height: 150px; position: relative; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 60%; filter: sepia(30%) saturate(70%); }
.photo-overlay { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(50,0,110,0.75) 0%, rgba(50,0,110,0.3) 60%, transparent 100%); display: flex; align-items: center; padding: 24px 32px; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="photo">
    <img src="../assets/pptx_image1.jpg" alt="UW campus landscape">
    <div class="photo-overlay">
      <div>
        <div style="font-family:'Open Sans';font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ffc700;margin-bottom:6px;">University of Washington</div>
        <div style="font-family:'Encode Sans',sans-serif;font-weight:900;font-size:22px;color:#fff;letter-spacing:0.06em;text-transform:uppercase;line-height:1.1;">Be Boundless</div>
      </div>
    </div>
  </div>
</body>
</html>
