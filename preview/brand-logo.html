<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Open Sans', sans-serif; background: #e8e3d3; padding: 20px; display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }

/* Logo display */
.logo-card { background: #fff; border-radius: 3px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.logo-card img { height: 60px; width: auto; }
.logo-label { font-size: 10px; color: #888; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }

.logo-card-dark { background: #4b2e83; border-radius: 3px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.logo-card-dark img { height: 60px; width: auto; filter: brightness(0) invert(1); }

/* SVG logos inline */
.svg-card { background: #32006e; border-radius: 3px; padding: 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
</style>
</head>
<body>
  <div style="display:flex;flex-direction:column;gap:8px;">
    <div style="font-size:9px;color:#888;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;">W Mark — Light BG</div>
    <div class="logo-card">
      <img src="../assets/W-Logo_Purple_RGB.png" alt="UW W mark">
      <div class="logo-label">Spirit Purple on White</div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px;">
    <div style="font-size:9px;color:#888;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;">W Mark — Dark BG</div>
    <div class="logo-card-dark">
      <img src="../assets/W-Logo_Purple_RGB.png" alt="UW W mark">
      <div class="logo-label" style="color:#e8d3a2;">White on Spirit Purple</div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px;">
    <div style="font-size:9px;color:#888;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;">W Letterform SVG</div>
    <div class="svg-card">
      <svg viewBox="0 0 108 72.62" xmlns="http://www.w3.org/2000/svg" height="60" style="fill:#ffffff;">
        <path d="M79.26 0 79.26 13.1 88.47 13.1 78.19 51.35C78.19 51.35 65.61 0.71 65.43 0L52.13 0C51.94 0.7 38.33 51.35 38.33 51.35L28.87 13.1 38.45 13.1 38.45 0 0 0 0 13.1 8.52 13.1C8.52 13.1 23.22 71.91 23.4 72.62L44.04 72.62C44.22 71.92 53.89 35.17 53.89 35.17 53.89 35.17 63.08 71.92 63.25 72.62L83.89 72.62C84.08 71.92 99.55 13.1 99.55 13.1L108 13.1 108 0 79.26 0Z"/>
      </svg>
      <div class="logo-label" style="color:#e8d3a2;">Wordmark SVG (Husky Purple bg)</div>
    </div>
  </div>
</body>
</html>
