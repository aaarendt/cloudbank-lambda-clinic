<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Open Sans', sans-serif; background: #fff; padding: 20px; display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
.swatch { width: 82px; }
.chip { height: 56px; border-radius: 3px; }
.name { font-size: 10px; font-weight: 600; color: #1a1a1a; margin-top: 5px; }
.hex  { font-size: 9px; color: #888; font-family: monospace; }
</style>
</head>
<body>
  <div class="swatch"><div class="chip" style="background:#1a1a1a;"></div><div class="name">Gray 90</div><div class="hex">#1a1a1a</div></div>
  <div class="swatch"><div class="chip" style="background:#4d4d4d;"></div><div class="name">Gray 70</div><div class="hex">#4d4d4d</div></div>
  <div class="swatch"><div class="chip" style="background:#808080;"></div><div class="name">Gray 50</div><div class="hex">#808080</div></div>
  <div class="swatch"><div class="chip" style="background:#b3b3b3;"></div><div class="name">Gray 30</div><div class="hex">#b3b3b3</div></div>
  <div class="swatch"><div class="chip" style="background:#e6e6e6; border: 1px solid #ddd;"></div><div class="name">Gray 10</div><div class="hex">#e6e6e6</div></div>
  <div class="swatch"><div class="chip" style="background:#e8d3a2; border: 1px solid #ddd;"></div><div class="name">Warm Cream</div><div class="hex">#e8d3a2</div></div>
  <div class="swatch"><div class="chip" style="background:#e8e3d3; border: 1px solid #ddd;"></div><div class="name">Gold Web</div><div class="hex">#e8e3d3</div></div>
  <div class="swatch"><div class="chip" style="background:#ffffff; border: 1px solid #ddd;"></div><div class="name">White</div><div class="hex">#ffffff</div></div>
</body>
</html>
