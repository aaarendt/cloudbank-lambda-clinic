<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Open Sans', sans-serif; background: #f5f5f5; padding: 20px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.group { background: #fff; padding: 16px; border-radius: 3px; min-width: 200px; display: flex; flex-direction: column; gap: 12px; }
.glabel { font-size: 9px; color: #888; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
label { font-size: 11px; font-weight: 600; color: #4b2e83; display: block; margin-bottom: 4px; }
input[type="text"], input[type="email"], select, textarea {
  font-family: 'Open Sans', sans-serif;
  font-size: 13px;
  width: 100%;
  padding: 8px 10px;
  border: 1px solid #b3b3b3;
  border-radius: 2px;
  color: #1a1a1a;
  background: #fff;
  outline: none;
  transition: border-color 150ms;
}
input:focus, select:focus, textarea:focus { border-color: #4b2e83; box-shadow: 0 0 0 2px rgba(75,46,131,0.15); }
.input-error { border-color: #e93cac !important; }
.error-msg { font-size: 10px; color: #e93cac; margin-top: 3px; }
.helper { font-size: 10px; color: #808080; margin-top: 3px; }
textarea { resize: vertical; height: 60px; }
.check-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #1a1a1a; }
input[type="checkbox"] { accent-color: #4b2e83; width: 14px; height: 14px; }
input[type="radio"] { accent-color: #4b2e83; width: 14px; height: 14px; }
</style>
</head>
<body>
  <div class="group">
    <div class="glabel">Text Inputs</div>
    <div>
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Jane Smith">
    </div>
    <div>
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="jane@uw.edu">
      <div class="helper">Use your UW NetID email</div>
    </div>
    <div>
      <label for="err">Student ID</label>
      <input type="text" id="err" value="abc" class="input-error">
      <div class="error-msg">Must be a 7-digit number</div>
    </div>
  </div>
  <div class="group">
    <div class="glabel">Select &amp; Textarea</div>
    <div>
      <label>Program of Study</label>
      <select>
        <option>Select a program…</option>
        <option>Computer Science</option>
        <option>Medicine</option>
        <option>Law</option>
      </select>
    </div>
    <div>
      <label>Statement of Purpose</label>
      <textarea placeholder="Tell us about yourself…"></textarea>
    </div>
  </div>
  <div class="group">
    <div class="glabel">Checkbox &amp; Radio</div>
    <div class="check-row"><input type="checkbox" checked> I agree to the terms</div>
    <div class="check-row"><input type="checkbox"> Subscribe to updates</div>
    <div class="check-row"><input type="radio" name="r" checked> Undergraduate</div>
    <div class="check-row"><input type="radio" name="r"> Graduate</div>
    <div class="check-row"><input type="radio" name="r"> Professional</div>
  </div>
</body>
</html>
