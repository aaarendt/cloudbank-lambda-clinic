<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
@font-face { font-family: 'Encode Sans Wide'; font-weight: 900; src: url('../fonts/EncodeSansWide-900-Black.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans Wide'; font-weight: 700; src: url('../fonts/EncodeSansWide-700-Bold.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans Wide'; font-weight: 400; src: url('../fonts/EncodeSansWide-400-Regular.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans Wide'; font-weight: 300; src: url('../fonts/EncodeSansWide-300-Light.ttf') format('truetype'); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #fff; padding: 18px 22px; display: flex; flex-direction: column; gap: 0; }
.row { display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid #f0f0f0; padding: 9px 0; }
.row:last-child { border-bottom: none; }
.label { font-size: 9px; color: #aaa; font-family: monospace; width: 80px; flex-shrink: 0; line-height: 1.6; }
.sample { color: #32006e; }
</style>
</head>
<body>
  <div class="row"><div class="label">Wide · 900</div><div class="sample" style="font-family:'Encode Sans Wide';font-weight:900;font-size:26px;letter-spacing:0.05em;text-transform:uppercase;">Be Boundless</div></div>
  <div class="row"><div class="label">Wide · 700</div><div class="sample" style="font-family:'Encode Sans Wide';font-weight:700;font-size:20px;letter-spacing:0.04em;">Encode Sans Wide Bold</div></div>
  <div class="row"><div class="label">Wide · 400</div><div class="sample" style="font-family:'Encode Sans Wide';font-weight:400;font-size:16px;">Encode Sans Wide Regular</div></div>
  <div class="row"><div class="label">Wide · 300</div><div class="sample" style="font-family:'Encode Sans Wide';font-weight:300;font-size:16px;color:#4b2e83;">Encode Sans Wide Light</div></div>
  <div class="row"><div class="label">Slide title use</div><div class="sample" style="font-family:'Encode Sans Wide';font-weight:900;font-size:18px;letter-spacing:0.14em;text-transform:uppercase;color:#4b2e83;">BRAND POWERPOINT TEMPLATE</div></div>
</body>
</html>
