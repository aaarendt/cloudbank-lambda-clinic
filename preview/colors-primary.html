<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Open Sans', sans-serif; background: #fff; padding: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap');
.swatch { width: 100px; }
.chip { height: 72px; border-radius: 3px; }
.name { font-size: 11px; font-weight: 600; color: #1a1a1a; margin-top: 6px; line-height: 1.3; }
.hex  { font-size: 10px; color: #666; font-family: monospace; }
.pms  { font-size: 9px; color: #999; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="swatch"><div class="chip" style="background:#32006e;"></div><div class="name">Husky Purple</div><div class="hex">#32006e</div><div class="pms">PMS 2685</div></div>
  <div class="swatch"><div class="chip" style="background:#4b2e83;"></div><div class="name">Spirit Purple</div><div class="hex">#4b2e83</div><div class="pms">PMS 266</div></div>
  <div class="swatch"><div class="chip" style="background:#b7a57a; border: 1px solid #ddd;"></div><div class="name">Husky Gold</div><div class="hex">#b7a57a</div><div class="pms">Print</div></div>
  <div class="swatch"><div class="chip" style="background:#e8e3d3; border: 1px solid #ddd;"></div><div class="name">Husky Gold Web</div><div class="hex">#e8e3d3</div><div class="pms">Digital</div></div>
  <div class="swatch"><div class="chip" style="background:#85754d;"></div><div class="name">Heritage Gold</div><div class="hex">#85754d</div></div>
  <div class="swatch"><div class="chip" style="background:#ffc700; border: 1px solid #ddd;"></div><div class="name">Spirit Gold</div><div class="hex">#ffc700</div></div>
</body>
</html>
