<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
@font-face { font-family: 'Encode Sans Compressed'; font-weight: 900; src: url('../fonts/EncodeSansCompressed-900-Black.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans Compressed'; font-weight: 700; src: url('../fonts/EncodeSansCompressed-700-Bold.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans Compressed'; font-weight: 400; src: url('../fonts/EncodeSansCompressed-400-Regular.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans Compressed'; font-weight: 300; src: url('../fonts/EncodeSansCompressed-300-Light.ttf') format('truetype'); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #fff; padding: 18px 22px; display: flex; flex-direction: column; gap: 0; }
.row { display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid #f0f0f0; padding: 9px 0; }
.row:last-child { border-bottom: none; }
.label { font-size: 9px; color: #aaa; font-family: monospace; width: 90px; flex-shrink: 0; line-height: 1.6; }
.sample { color: #32006e; }
</style>
</head>
<body>
  <div class="row"><div class="label">Compressed · 900</div><div class="sample" style="font-family:'Encode Sans Compressed';font-weight:900;font-size:36px;letter-spacing:0.03em;text-transform:uppercase;">University of Washington</div></div>
  <div class="row"><div class="label">Compressed · 700</div><div class="sample" style="font-family:'Encode Sans Compressed';font-weight:700;font-size:28px;">Encode Sans Compressed Bold</div></div>
  <div class="row"><div class="label">Compressed · 400</div><div class="sample" style="font-family:'Encode Sans Compressed';font-weight:400;font-size:20px;">Encode Sans Compressed Regular</div></div>
  <div class="row"><div class="label">Stat use</div><div style="font-family:'Encode Sans Compressed';font-weight:900;font-size:42px;color:#ffc700;line-height:1;letter-spacing:-0.01em;">56K+ <span style="font-size:16px;color:#4b2e83;letter-spacing:0.06em;font-weight:700;">STUDENTS ENROLLED</span></div></div>
</body>
</html>
