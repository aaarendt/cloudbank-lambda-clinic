<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
@font-face { font-family: 'Encode Sans'; font-weight: 100; src: url('../fonts/EncodeSansNormal-100-Thin.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans'; font-weight: 200; src: url('../fonts/EncodeSansNormal-200-ExtraLight.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans'; font-weight: 300; src: url('../fonts/EncodeSansNormal-300-Light.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans'; font-weight: 400; src: url('../fonts/EncodeSansNormal-400-Regular.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans'; font-weight: 500; src: url('../fonts/EncodeSansNormal-500-Medium.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans'; font-weight: 600; src: url('../fonts/EncodeSansNormal-600-SemiBold.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans'; font-weight: 700; src: url('../fonts/EncodeSansNormal-700-Bold.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans'; font-weight: 800; src: url('../fonts/EncodeSansNormal-800-ExtraBold.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans'; font-weight: 900; src: url('../fonts/EncodeSansNormal-900-Black.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans Wide'; font-weight: 900; src: url('../fonts/EncodeSansWide-900-Black.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans Compressed'; font-weight: 900; src: url('../fonts/EncodeSansCompressed-900-Black.ttf') format('truetype'); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #fff; padding: 18px 22px; display: flex; flex-direction: column; gap: 0; }
.row { display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid #f0f0f0; padding: 9px 0; }
.row:last-child { border-bottom: none; }
.label { font-size: 9px; color: #aaa; font-family: monospace; width: 100px; flex-shrink: 0; line-height: 1.6; }
.sample { color: #32006e; }
</style>
</head>
<body>
  <div class="row"><div class="label">Normal · 900<br>Black</div><div class="sample" style="font-family:'Encode Sans';font-weight:900;font-size:28px;letter-spacing:0.08em;text-transform:uppercase;">UNIVERSITY OF WASHINGTON</div></div>
  <div class="row"><div class="label">Normal · 700<br>Bold</div><div class="sample" style="font-family:'Encode Sans';font-weight:700;font-size:22px;letter-spacing:0.04em;">Encode Sans Bold</div></div>
  <div class="row"><div class="label">Normal · 400<br>Regular</div><div class="sample" style="font-family:'Encode Sans';font-weight:400;font-size:18px;">Encode Sans Regular</div></div>
  <div class="row"><div class="label">Normal · 300<br>Light</div><div class="sample" style="font-family:'Encode Sans';font-weight:300;font-size:18px;color:#4b2e83;">Encode Sans Light</div></div>
  <div class="row"><div class="label">Wide · 900<br>Black</div><div class="sample" style="font-family:'Encode Sans Wide';font-weight:900;font-size:22px;letter-spacing:0.06em;text-transform:uppercase;">Wide Black — Impact</div></div>
  <div class="row"><div class="label">Compressed · 900<br>Black</div><div class="sample" style="font-family:'Encode Sans Compressed';font-weight:900;font-size:32px;letter-spacing:0.04em;text-transform:uppercase;">Compressed Black — Dense Data</div></div>
</body>
</html>
