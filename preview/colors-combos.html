<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Encode+Sans:wght@900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Open Sans', sans-serif; background: #f5f5f5; padding: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
.combo { width: 148px; height: 72px; border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.combo .main { font-family: 'Encode Sans', sans-serif; font-weight: 900; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; }
.combo .sub { font-size: 10px; font-weight: 600; opacity: 0.75; }
.tick { font-size: 9px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 4px; color: #555; }
.wrap { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="combo" style="background:#4b2e83; color:#fff;"><div class="main">White on</div><div class="sub">Spirit Purple</div></div>
    <div class="tick">✓ Accessible</div>
  </div>
  <div class="wrap">
    <div class="combo" style="background:#fff; color:#4b2e83; border: 1px solid #e0e0e0;"><div class="main">Spirit Purple</div><div class="sub">on White</div></div>
    <div class="tick">✓ Accessible</div>
  </div>
  <div class="wrap">
    <div class="combo" style="background:#85754d; color:#fff;"><div class="main">White on</div><div class="sub">Heritage Gold</div></div>
    <div class="tick">✓ Accessible</div>
  </div>
  <div class="wrap">
    <div class="combo" style="background:#4b2e83; color:#e8e3d3;"><div class="main">Husky Gold</div><div class="sub">on Spirit Purple</div></div>
    <div class="tick">✓ Accessible</div>
  </div>
</body>
</html>
