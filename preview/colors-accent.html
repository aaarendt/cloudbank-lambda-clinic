<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Open Sans', sans-serif; background: #fff; padding: 20px; }
.label { font-size: 10px; font-weight: 600; color: #666; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 100px; }
.chip { height: 72px; border-radius: 3px; }
.name { font-size: 11px; font-weight: 600; color: #1a1a1a; margin-top: 6px; line-height: 1.3; }
.hex  { font-size: 10px; color: #666; font-family: monospace; }
.note { font-size: 9px; color: #e93cac; margin-top: 10px; }
</style>
</head>
<body>
  <div class="label">Accent Colors — use ≤ 15% of any design</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#aadb1e;"></div><div class="name">Accent Green</div><div class="hex">#aadb1e</div></div>
    <div class="swatch"><div class="chip" style="background:#2ad2c9;"></div><div class="name">Accent Teal</div><div class="hex">#2ad2c9</div></div>
    <div class="swatch"><div class="chip" style="background:#e93cac;"></div><div class="name">Accent Pink</div><div class="hex">#e93cac</div></div>
    <div class="swatch"><div class="chip" style="background:#c5b4e3;"></div><div class="name">Accent Lavender</div><div class="hex">#c5b4e3</div></div>
  </div>
</body>
</html>
