<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UW Website UI Kit</title>
<style>
@font-face { font-family: 'Encode Sans'; font-weight: 100; src: url('../../fonts/EncodeSansNormal-100-Thin.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans'; font-weight: 300; src: url('../../fonts/EncodeSansNormal-300-Light.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans'; font-weight: 400; src: url('../../fonts/EncodeSansNormal-400-Regular.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans'; font-weight: 600; src: url('../../fonts/EncodeSansNormal-600-SemiBold.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans'; font-weight: 700; src: url('../../fonts/EncodeSansNormal-700-Bold.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans'; font-weight: 900; src: url('../../fonts/EncodeSansNormal-900-Black.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans Wide'; font-weight: 700; src: url('../../fonts/EncodeSansWide-700-Bold.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans Wide'; font-weight: 900; src: url('../../fonts/EncodeSansWide-900-Black.ttf') format('truetype'); }
@font-face { font-family: 'Encode Sans Compressed'; font-weight: 900; src: url('../../fonts/EncodeSansCompressed-900-Black.ttf') format('truetype'); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Open Sans', sans-serif; background: #f5f5f5; min-height: 100vh; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel">
const pages = ['Home', 'Academics', 'Research', 'Admissions'];

const programsData = [
  { college: 'Paul G. Allen School', title: 'Computer Science', description: 'Join one of the top-ranked CS programs in the world, known for AI, systems, and human-computer interaction research.' },
  { college: 'School of Medicine', title: 'Medicine & Public Health', description: 'Lead innovation in healthcare with programs spanning clinical medicine to global population health initiatives.' },
  { college: 'Foster School of Business', title: 'Business & Entrepreneurship', description: 'Develop leadership skills in one of the Pacific Northwest\'s premier business schools.' },
  { college: 'College of Engineering', title: 'Engineering & Technology', description: 'Build the future with cutting-edge research across aerospace, civil, electrical, and mechanical engineering.' },
  { college: 'College of Arts & Sciences', title: 'Arts & Sciences', description: 'Explore the humanities, social sciences, natural sciences, and the arts in a vibrant intellectual community.' },
  { college: 'School of Law', title: 'Law & Justice', description: 'Train in law with a commitment to public service, access to justice, and the rule of law.' },
];

const newsData = [
  { date: 'April 22, 2026', tag: 'Research', title: 'UW Scientists Develop Breakthrough in Clean Energy Storage', excerpt: 'Researchers at the Clean Energy Institute announce a new battery technology that could cut costs by 40%.' },
  { date: 'April 18, 2026', tag: 'Campus', title: 'Cherry Blossoms Return to the UW Quad', excerpt: 'The beloved springtime tradition draws thousands of visitors to campus each year as the 30 Yoshino cherry trees bloom.' },
  { date: 'April 10, 2026', tag: 'Academics', title: 'UW Rises to #9 Among Public Universities Globally', excerpt: 'The University of Washington maintained its position among the world\'s elite public research universities.' },
];

// ── Home Page ──────────────────────────────────────────────────────────────
function HomePage({ onNav }) {
  const s = {
    section: { maxWidth: 1200, margin: '0 auto', padding: '64px 32px' },
    sectionHeadingWrap: { marginBottom: 40 },
    overline: { fontFamily: "'Open Sans', sans-serif", fontSize: 11, fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase', color: '#85754d', marginBottom: 8 },
    sectionTitle: { fontFamily: "'Encode Sans', sans-serif", fontWeight: 900, fontSize: 28, letterSpacing: '0.07em', textTransform: 'uppercase', color: '#32006e' },
    goldLine: { width: 48, height: 3, background: '#ffc700', marginTop: 12 },
    programGrid: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 20 },
    newsGrid: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 20 },
    cta: { background: '#4b2e83', padding: '72px 0', textAlign: 'center' },
    ctaInner: { maxWidth: 640, margin: '0 auto', padding: '0 32px' },
    ctaTitle: { fontFamily: "'Encode Sans Wide', sans-serif", fontWeight: 900, fontSize: 36, letterSpacing: '0.06em', textTransform: 'uppercase', color: '#fff', lineHeight: 1.1, marginBottom: 20 },
    ctaSub: { fontFamily: "'Open Sans', sans-serif", fontSize: 17, color: '#e8e3d3', fontWeight: 300, lineHeight: 1.6, marginBottom: 32 },
    ctaBtn: { background: '#ffc700', color: '#32006e', border: 'none', borderRadius: 2, padding: '14px 36px', fontFamily: "'Open Sans', sans-serif", fontWeight: 700, fontSize: 13, letterSpacing: '0.08em', textTransform: 'uppercase', cursor: 'pointer', marginRight: 12 },
    ctaBtnOut: { background: 'transparent', color: '#fff', border: '2px solid #fff', borderRadius: 2, padding: '14px 36px', fontFamily: "'Open Sans', sans-serif", fontWeight: 700, fontSize: 13, letterSpacing: '0.08em', textTransform: 'uppercase', cursor: 'pointer' },
  };
  return (
    <div>
      <Hero title="Be Boundless" subtitle="Explore world-class programs at one of the world's top public universities, located in the heart of Seattle." onCta={() => onNav('Academics')} />
      <StatsBar />
      {/* Programs */}
      <div style={{ background: '#fff' }}>
        <div style={s.section}>
          <div style={s.sectionHeadingWrap}>
            <div style={s.overline}>Explore</div>
            <div style={s.sectionTitle}>Programs &amp; Schools</div>
            <div style={s.goldLine}></div>
          </div>
          <div style={s.programGrid}>
            {programsData.map(p => <ProgramCard key={p.title} {...p} onClick={() => onNav('Academics')} />)}
          </div>
        </div>
      </div>
      {/* CTA Banner */}
      <div style={s.cta}>
        <div style={s.ctaInner}>
          <div style={s.ctaTitle}>Ready to Begin Your Journey?</div>
          <p style={s.ctaSub}>Join a community of scholars, innovators, and changemakers dedicated to making a difference in the world.</p>
          <button style={s.ctaBtn} onClick={() => onNav('Admissions')}>Apply Now</button>
          <button style={s.ctaBtnOut}>Request Info</button>
        </div>
      </div>
      {/* News */}
      <div style={{ background: '#e8e3d3' }}>
        <div style={s.section}>
          <div style={s.sectionHeadingWrap}>
            <div style={s.overline}>Latest</div>
            <div style={s.sectionTitle}>UW News</div>
            <div style={s.goldLine}></div>
          </div>
          <div style={s.newsGrid}>
            {newsData.map(n => <NewsCard key={n.title} {...n} />)}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Academics Page ─────────────────────────────────────────────────────────
function AcademicsPage({ onNav }) {
  const s = {
    content: { maxWidth: 1200, margin: '0 auto', padding: '48px 32px' },
    layout: { display: 'grid', gridTemplateColumns: '240px 1fr', gap: 48, alignItems: 'start' },
    sidebar: { background: '#fff', borderRadius: 2, padding: '24px 0', boxShadow: '0 2px 10px rgba(50,0,110,0.08)' },
    sideHeading: { fontFamily: "'Encode Sans', sans-serif", fontWeight: 900, fontSize: 11, letterSpacing: '0.12em', textTransform: 'uppercase', color: '#85754d', padding: '0 20px 12px', borderBottom: '2px solid #ffc700' },
    sideLinks: { display: 'flex', flexDirection: 'column' },
    sideLink: (active) => ({ padding: '11px 20px', fontSize: 13, fontWeight: active ? 700 : 400, color: active ? '#4b2e83' : '#4d4d4d', background: active ? '#f0ebf7' : 'transparent', borderLeft: active ? '3px solid #4b2e83' : '3px solid transparent', cursor: 'pointer', textDecoration: 'none' }),
    main: {},
    pageTitle: { fontFamily: "'Encode Sans', sans-serif", fontWeight: 900, fontSize: 28, letterSpacing: '0.07em', textTransform: 'uppercase', color: '#32006e', marginBottom: 10 },
    goldLine: { width: 48, height: 3, background: '#ffc700', marginBottom: 24 },
    intro: { fontSize: 16, color: '#4d4d4d', lineHeight: 1.7, maxWidth: 680, marginBottom: 36 },
    grid: { display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 18 },
  };
  const sideItems = ['All Programs', 'Undergraduate', 'Graduate', 'Professional', 'Online', 'Continuing Education'];
  return (
    <div style={{ background: '#f5f5f5', minHeight: '60vh' }}>
      <Breadcrumb items={['Home', 'Academics']} />
      <div style={s.content}>
        <div style={s.layout}>
          <div style={s.sidebar}>
            <div style={s.sideHeading}>Academics</div>
            <div style={s.sideLinks}>
              {sideItems.map((item, i) => <a key={item} style={s.sideLink(i === 0)} href="#">{item}</a>)}
            </div>
          </div>
          <div style={s.main}>
            <div style={s.pageTitle}>Schools &amp; Programs</div>
            <div style={s.goldLine}></div>
            <p style={s.intro}>UW offers more than 370 degree programs across 18 schools and colleges. Find the program that fits your goals and passions.</p>
            <div style={s.grid}>
              {programsData.map(p => <ProgramCard key={p.title} {...p} />)}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Admissions Page ────────────────────────────────────────────────────────
function AdmissionsPage() {
  const s = {
    hero: { background: '#32006e', padding: '52px 0' },
    heroInner: { maxWidth: 1200, margin: '0 auto', padding: '0 32px', display: 'grid', gridTemplateColumns: '1fr 380px', gap: 48, alignItems: 'center' },
    heroTitle: { fontFamily: "'Encode Sans Wide', sans-serif", fontWeight: 900, fontSize: 36, letterSpacing: '0.06em', textTransform: 'uppercase', color: '#fff', lineHeight: 1.05, marginBottom: 16 },
    heroSub: { fontSize: 16, color: '#e8e3d3', fontWeight: 300, lineHeight: 1.7, marginBottom: 28 },
    heroBtn: { background: '#ffc700', color: '#32006e', border: 'none', borderRadius: 2, padding: '13px 28px', fontFamily: "'Open Sans', sans-serif", fontWeight: 700, fontSize: 13, letterSpacing: '0.08em', textTransform: 'uppercase', cursor: 'pointer' },
    card: { background: '#fff', borderRadius: 2, padding: '28px', boxShadow: '0 4px 20px rgba(0,0,0,0.2)' },
    cardTitle: { fontFamily: "'Encode Sans', sans-serif", fontWeight: 900, fontSize: 14, letterSpacing: '0.1em', textTransform: 'uppercase', color: '#32006e', marginBottom: 18 },
    step: { display: 'flex', gap: 14, marginBottom: 16, alignItems: 'flex-start' },
    stepNum: { width: 28, height: 28, borderRadius: '50%', background: '#4b2e83', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 900, fontSize: 13, flexShrink: 0 },
    stepText: { fontSize: 13, color: '#4d4d4d', lineHeight: 1.5, paddingTop: 4 },
    section: { maxWidth: 1200, margin: '0 auto', padding: '52px 32px' },
    dates: { background: '#fff', padding: '52px 0' },
    dateGrid: { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 24 },
    dateCard: { border: '1px solid #e6e6e6', borderTop: '4px solid #ffc700', borderRadius: 2, padding: '24px' },
    dateType: { fontSize: 11, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: '#85754d', marginBottom: 10 },
    dateVal: { fontFamily: "'Encode Sans Compressed', sans-serif", fontWeight: 900, fontSize: 28, color: '#32006e', marginBottom: 6 },
    dateDesc: { fontSize: 13, color: '#4d4d4d', lineHeight: 1.5 },
  };
  const steps = ['Create your UW application account', 'Complete the Common App or Coalition App', 'Submit transcripts, test scores, and letters of recommendation', 'Write your personal statement', 'Pay the $85 application fee or request a waiver', 'Track your application status online'];
  const dates = [
    { type: 'Early Action', date: 'November 15', desc: 'Non-binding early admission for freshman applicants.' },
    { type: 'Regular Decision', date: 'January 15', desc: 'Standard freshman application deadline for all programs.' },
    { type: 'Transfer', date: 'February 15', desc: 'Application deadline for transfer students for autumn quarter.' },
  ];
  return (
    <div>
      <div style={s.hero}>
        <div style={s.heroInner}>
          <div>
            <div style={s.heroTitle}>Start Your UW Journey</div>
            <p style={s.heroSub}>More than 50,000 students call UW home. Find out how to become one of them — and discover what makes a Husky.</p>
            <button style={s.heroBtn}>Begin Application</button>
          </div>
          <div style={s.card}>
            <div style={s.cardTitle}>Application Steps</div>
            {steps.map((step, i) => (
              <div key={i} style={s.step}>
                <div style={s.stepNum}>{i + 1}</div>
                <div style={s.stepText}>{step}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
      <div style={s.dates}>
        <div style={s.section}>
          <div style={{ fontFamily: "'Encode Sans', sans-serif", fontWeight: 900, fontSize: 22, letterSpacing: '0.08em', textTransform: 'uppercase', color: '#32006e', marginBottom: 10 }}>Key Dates &amp; Deadlines</div>
          <div style={{ width: 48, height: 3, background: '#ffc700', marginBottom: 28 }}></div>
          <div style={s.dateGrid}>
            {dates.map(d => (
              <div key={d.type} style={s.dateCard}>
                <div style={s.dateType}>{d.type}</div>
                <div style={s.dateVal}>{d.date}</div>
                <p style={s.dateDesc}>{d.desc}</p>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── App Shell ──────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = React.useState('Home');
  return (
    <div>
      <SiteHeader activePage={page} onNav={setPage} />
      {page === 'Home' && <HomePage onNav={setPage} />}
      {page === 'Academics' && <AcademicsPage onNav={setPage} />}
      {page === 'Admissions' && <AdmissionsPage />}
      {(page === 'Research' || page === 'Campus Life') && (
        <div style={{ maxWidth: 1200, margin: '80px auto', padding: '0 32px', textAlign: 'center', color: '#808080', fontFamily: "'Open Sans',sans-serif" }}>
          <div style={{ fontFamily: "'Encode Sans',sans-serif", fontWeight: 900, fontSize: 20, letterSpacing: '0.08em', textTransform: 'uppercase', color: '#b3b3b3', marginBottom: 12 }}>{page}</div>
          <p>This section is a placeholder in the UI kit.<br/>Navigate to <strong>Home</strong>, <strong>Academics</strong>, or <strong>Admissions</strong> for full interactive screens.</p>
        </div>
      )}
      <SiteFooter />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</head>
<body>
<div id="root"></div>
</body>
</html>
